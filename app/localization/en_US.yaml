COMMAND_CONFIRMATION:
    QUIT: Are you sure you want to stop the server without saving? Unsaved data will be lost!
    RESET: Are you sure you want to restart the server without saving? Unsaved data will be lost!
    ROLLBACK: How many saves would you like to roll back?
    CLOSE_APP: |-
        The server is still running.

        Closing {APP_NAME} will save the world and shut the server down. Do you want to close anyway?

COMMAND_ANNOUNCEMENT:
    SAVE: Saving world...
    QUIT: Stopping...
    RESET: Restarting...
    ROLLBACK: Rolling back in 5 seconds!
    SAVE_QUIT: Saving world and stopping...

ENTRY:
    GAME_TITLE: Game Directory
    CLUSTER_TITLE: Worlds Directory
    TOKEN_TITLE: Server Token
    ENTRY_INVALID_INPUT: "✱ Invalid Input"

    # Shown next to the field's title. Keep these short, they share the row with it.
    INVALID:
        EMPTY: "✱ Required"
        MISSING: "✱ Invalid Folder"
        NO_EXECUTABLE: "✱ Invalid Folder"
        IS_WORLD: "✱ Select Parent Folder"
        NO_CLUSTERS: "✱ No Worlds"
        INCOMPLETE_WORLD: "✱ Invalid World"
        CLOUD_SAVES: "✱ Cloud Save"
        WRONG_LOCATION: "✱ Invalid Folder"
        TOKEN_FORMAT: "✱ Invalid Token"
        TOKEN_REJECTED: "✱ Token Rejected"

    # Shown when hovering the message above.
    INVALID_HELP:
        EMPTY: This field has to be filled in before the server can start.
        MISSING: This folder doesn't exist. It may have been moved, renamed or deleted.
        NO_EXECUTABLE: This isn't the game folder. It must contain bin64/dontstarve_dedicated_server_nullrenderer_x64.exe.
        IS_WORLD: This is a world folder. Select the folder that contains it, usually Documents/Klei/DoNotStarveTogether/<numbers>/.
        INCOMPLETE_WORLD: This world is incomplete, it needs a cluster.ini file and a Master folder.
        NO_CLUSTERS: No worlds were found in this folder. Create one in the game, or select the folder that holds your world folders (Cluster_1, Cluster_2...).
        CLOUD_SAVES: Cloud saves are not supported.
        WRONG_LOCATION: This isn't a folder of worlds. Select your Klei account folder, usually Documents/Klei/DoNotStarveTogether/<numbers>/.
        TOKEN_FORMAT: This isn't a valid server token.
        TOKEN_REJECTED: The server refused this token. It may have expired, been revoked, or already be in use by another running server.

ERROR:
    TOKEN_INVALID: |-
        The provided server token is invalid or has expired.

        Please generate a new token on the Klei Account page and paste it into the Server Token field.
    TOKEN_EMPTY: A server token is required to run a Dedicated Server. Hover over the ⓘ icon for instructions on how to obtain one.
    GENERAL: |-
        An error occurred while launching the server.

        This may be caused by missing game files, an incorrect game directory, or a permissions issue. Please check the server log for details.
    START_FAILED: |-
        Failed to start the {shard} shard.

        The server executable could not be launched. Please verify that:
        • The game directory path is correct.
        • The game files are not corrupted (verify integrity via Steam).
        • No antivirus software is blocking the executable.
    PORTS: |-
        The server failed to start due to one of the following reasons:

        • The world is not in the same directory as the worlds generated in-game.

        • One or more of the following ports ({ports}) are already in use by another program, including in-game servers.

        Close any other running servers or change the ports in each shard's server.ini file.

        If neither applies, please report the issue.
    EXCEPTION: |-
        An unexpected error occurred!

        > {error}

        The application will be restarted.

        If a server is currently running, it will be saved and safely shut down.

        Please consider reporting this error by creating an issue on Github.
    LAUNCH_DATA_INVALID: |-
        {APP_NAME} needs initial server configuration data that is generated when you first run a world from the in-game menu.

        Please launch any world from the in-game menu, wait for it to start, then stop it.

        Once done, click the Try Again button below.
    SERVER_CRASH: |-
        Your server has crashed due to a Lua error. Please refer to the game's log files for more information.

        Common causes: incompatible or outdated mods, corrupted world save data, or a game bug.

        This is a game crash, not a {APP_NAME} issue. Consider disabling recently added mods or reporting the issue to Klei.
    DIRECTORY_INVALID: |-
        The selected {directory_name} path is invalid or does not contain the expected files.

        Please select a valid directory before launching the server.
    WORLD_INVALID: |-
        No valid world is selected.

        Please pick a world from the list under the Server Token field before launching the server.
    COMMAND_FAILED: |-
        Failed to send command to the {shard} shard.

        The server process may have become unresponsive. Check the server log for errors.

