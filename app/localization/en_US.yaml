        LIGHTSOUT: Lights Out
        LAVAARENA: Forge
        QUAGMIRE: Gorge
ASK_DIRECTORY_TITLE: "  Select Directory"

CLUSTER_GROUP_TOOLTIP: |-
    ➊    Select the game installation folder under {GAME_TITLE}, if it hasn't been automatically populated.
    ➋    Create a world in-game, select your worlds folder under {CLUSTER_TITLE} and pick it in the list.
    ➌    Paste a server token under {TOKEN_TITLE}. Hover over the ⓘ icon for instructions on how to obtain one.
    ➍    Finally, click on the {LAUNCH} button and have fun!

CLUSTER_GROUP_TOOLTIP_HIGHLIGHT_PATTERNS:
    - "{GAME_TITLE}"
    - "{CLUSTER_TITLE}"
    - "{TOKEN_TITLE}"
    - ⓘ
    - "{LAUNCH}"
    - ➊
    - ➋
    - ➌
    - ➍

