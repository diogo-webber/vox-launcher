ERROR:
    TOKEN_INVALID: |-
        Указанный токен сервера недействителен или срок его действия истёк.

        Пожалуйста, сгенерируйте новый токен на странице аккаунта Klei и вставьте его в поле Токен сервера.
    TOKEN_EMPTY: Для запуска выделенного сервера требуется токен. Наведите курсор на значок ⓘ для получения инструкций по его получению.
    GENERAL: |-
        Произошла ошибка при запуске сервера.

        Это может быть вызвано отсутствием файлов игры, неверным путём к директории игры или проблемой с правами доступа. Пожалуйста, проверьте лог сервера для получения подробностей.
    START_FAILED: |-
        Не удалось запустить шард {shard}.

        Исполняемый файл сервера не может быть запущен. Пожалуйста, проверьте:
        • Путь к директории игры указан правильно.
        • Файлы игры не повреждены (проверьте целостность через Steam).
        • Антивирусное ПО не блокирует исполняемый файл.
    PORTS: |-
        Сервер не удалось запустить по одной из следующих причин:

        • Мир не находится в той же директории, что и миры, созданные в игре.

        • Один или несколько следующих портов ({ports}) уже используются другой программой, включая серверы в игре.

        Закройте другие работающие серверы или измените порты в файле server.ini каждого шарда.

        Если ни одно из этих условий не подходит, пожалуйста, сообщите о проблеме.
    EXCEPTION: |-
        Произошла непредвиденная ошибка!

        > {error}

        Приложение будет перезапущено.

        Если сервер в данный момент работает, он будет сохранен и безопасно завершен.

        Пожалуйста, рассмотрите возможность сообщить об этой ошибке, создав issue на GitHub.
    LAUNCH_DATA_INVALID: |-
        {APP_NAME} нуждается в начальных данных конфигурации сервера, которые генерируются при первом запуске мира из игрового меню.

        Пожалуйста, запустите любой мир из игрового меню, дождитесь его запуска, затем остановите.

        После этого нажмите кнопку "Повторить" ниже.
    SERVER_CRASH: |-
        Ваш сервер аварийно завершил работу из-за ошибки Lua. Пожалуйста, обратитесь к файлам журнала игры для получения дополнительной информации.

        Частые причины: несовместимые или устаревшие моды, повреждённые данные сохранения или баг игры.

        Это сбой игры, а не проблема {APP_NAME}. Рассмотрите возможность отключения недавно добавленных модов или сообщите о проблеме в Klei.
    DIRECTORY_INVALID: |-
        Выбранный путь {directory_name} недействителен или не содержит ожидаемых файлов.

        Пожалуйста, выберите правильную директорию перед запуском сервера.
    WORLD_INVALID: |-
        Не выбран допустимый мир.

        Пожалуйста, выберите мир из списка под полем Токен сервера перед запуском сервера.
    COMMAND_FAILED: |-
        Не удалось отправить команду шарду {shard}.

        Процесс сервера может не отвечать. Проверьте лог сервера для выявления ошибок.

